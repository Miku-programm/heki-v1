name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Fail fast if go.mod/go.sum drifted from what the code actually needs.
      - name: Verify modules are tidy
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race catches the data-race-sensitive paths (the reconstructed
      # sing-anytls async recv pump, the QUIC/REALITY handshakes). Hermetic:
      # every listener/Dest in the suite is on 127.0.0.1.
      - name: Test (race)
        run: go test ./... -race -count=1 -timeout 600s
